<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Activity Log - SINDHU</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body { background: var(--bg); color: var(--text); font-family: inherit; margin: 0; }
  .al-wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  .al-header { margin-bottom: 20px; }
  .al-header h1 { font-size: 22px; margin: 0 0 6px; }
  .al-header p { color: var(--text-dim); font-size: 14px; margin: 0; max-width: 68ch; }

  .al-summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin: 20px 0 28px;
  }
  .al-stat.card { padding: 13px 16px; }
  .al-stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 5px; }
  .al-stat .value { font-size: 21px; font-weight: 700; }
  .al-stat .value.live { color: var(--green); }
  .al-stat .sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .al-section { margin-bottom: 28px; }
  .al-section h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-faint); margin: 0 0 10px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .al-section h2 .count { color: var(--text-dim); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .al-empty { color: var(--text-faint); font-size: 13px; padding: 12px 4px; }

  .al-item.card { padding: 14px 16px; margin-bottom: 8px; }
  .al-item-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .al-item-title { font-size: 14px; font-weight: 600; }
  .al-item-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .al-progress-track { height: 6px; border-radius: 3px; background: var(--bg-hover); overflow: hidden; margin-top: 10px; }
  .al-progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .3s; }
  .al-stall { margin-top: 8px; }

  .ws-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ws-dot.on { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
  .ws-dot.off { background: var(--text-faint); }
  .ws-status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
  <div class="al-wrap">
    <div class="al-header">
      <h1>Live Activity Log</h1>
      <p>Read-only view of everything running, queued, or recently finished in SINDHU -- pulled from the real job manager, activity log, and pipeline history. Does not start, stop, or change anything.</p>
    </div>

    <div class="al-summary" id="summary"></div>

    <div class="al-section">
      <h2>Running Now <span class="count" id="running-count"></span> <span class="ws-status" id="ws-status" style="margin-left:auto"><span class="ws-dot off" id="ws-dot"></span><span id="ws-label">connecting...</span></span></h2>
      <div id="running-list"></div>
    </div>

    <div class="al-section">
      <h2>Queued / Pending <span class="count" id="queued-count"></span></h2>
      <div id="queued-list"></div>
    </div>

    <div class="al-section">
      <h2>Recently Completed <span class="count" id="completed-count"></span></h2>
      <div id="completed-list"></div>
    </div>
  </div>

<script src="/static/js/activity_log_page.js"></script>
</body>
</html>
